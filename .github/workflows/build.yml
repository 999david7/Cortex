# Builds Cortex for macOS (a universal .app in a disk image) and Windows on
# every push. Pushing a tag that starts with "v" also publishes both as a
# GitHub release, with .github/release-notes.md as its text.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Static and universal, so the app runs on Apple silicon and Intel Macs
      # with nothing else installed.
      - name: Build GLFW 3.4
        run: |
          git clone --depth 1 --branch 3.4 https://github.com/glfw/glfw.git "$RUNNER_TEMP/glfw-src"
          cmake -S "$RUNNER_TEMP/glfw-src" -B "$RUNNER_TEMP/glfw-build" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/glfw"
          cmake --build "$RUNNER_TEMP/glfw-build" --target install -j 4

      - name: Editor tests
        run: make test -j 4

      - name: Build Cortex.app and the disk image
        run: make dmg -j 4 GLFW_PREFIX="$RUNNER_TEMP/glfw" ARCHS="arm64 x86_64"

      - name: Check the app
        run: |
          lipo -info build/Cortex.app/Contents/MacOS/cortex
          otool -L build/Cortex.app/Contents/MacOS/cortex
          codesign --verify --verbose build/Cortex.app
          plutil -lint build/Cortex.app/Contents/Info.plist
          hdiutil verify build/Cortex-*.dmg

      # Starts the real app on the runner and saves what its window shows.
      - name: Launch it and take a screenshot
        continue-on-error: true
        run: |
          ./build/Cortex.app/Contents/MacOS/cortex "$PWD/examples/demo.cpp" \
            --screenshot "$PWD/build/macos-screenshot.bmp" 90 &
          pid=$!
          for i in $(seq 1 60); do sleep 1; kill -0 $pid 2>/dev/null || break; done
          kill $pid 2>/dev/null || true
          sips -s format png build/macos-screenshot.bmp --out build/macos-screenshot.png

      - uses: actions/upload-artifact@v4
        with:
          name: Cortex-macOS
          path: |
            build/Cortex-*.dmg
            build/macos-screenshot.png
          if-no-files-found: warn

  windows:
    name: Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix
      - name: Build AI-IDE.exe
        run: make -j 4 CXX=x86_64-w64-mingw32-g++-posix
      - name: Package
        run: cd build && zip "../Cortex-$(cat ../VERSION)-windows.zip" AI-IDE.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Cortex-Windows
          path: Cortex-*-windows.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          gh release create "$GITHUB_REF_NAME" dist/Cortex-*.dmg dist/Cortex-*-windows.zip \
            --title "Cortex BETA $version" --prerelease --notes-file .github/release-notes.md
